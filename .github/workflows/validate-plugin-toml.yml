name: Validate Plugin TOML

on:
  pull_request:
    branches:
      - master
    paths:
      - 'plugins/**'
      - 'constants.ts'
      - 'validate.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/validate-plugin-toml.yml'

permissions:
  contents: read

concurrency:
  group: validate-plugin-toml-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Get changed plugins
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED_PLUGINS=$(git diff --name-only --diff-filter=ACMR "${BASE_SHA}...${HEAD_SHA}" -- plugins | awk -F/ 'NF >= 2 { print $2 }' | sort -u | tr '\n' ' ')
          CHANGED_PLUGINS="${CHANGED_PLUGINS% }"

          for plugin in $CHANGED_PLUGINS; do
            if ! printf '%s' "$plugin" | grep -Eq '^[a-z0-9_-]+$'; then
              echo "Invalid plugin directory name: $plugin" >&2
              exit 1
            fi
          done

          if [ -n "$CHANGED_PLUGINS" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi
          echo "plugins=$CHANGED_PLUGINS" >> "$GITHUB_OUTPUT"
          echo "Changed plugins: ${CHANGED_PLUGINS:-none}"

      - name: Setup Node.js
        if: steps.changed.outputs.has_changes == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup pnpm
        if: steps.changed.outputs.has_changes == 'true'
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Install dependencies
        if: steps.changed.outputs.has_changes == 'true'
        run: pnpm install --frozen-lockfile

      - name: Validate plugin.toml files
        id: validate
        if: steps.changed.outputs.has_changes == 'true'
        continue-on-error: true
        env:
          VALIDATION_REPORT_PATH: validation-report.md
          CHANGED_PLUGINS: ${{ steps.changed.outputs.plugins }}
        run: |
          test -n "$CHANGED_PLUGINS"
          read -r -a plugin_names <<< "$CHANGED_PLUGINS"
          pnpm validate "${plugin_names[@]}"
          echo "result=success" >> $GITHUB_OUTPUT

      - name: Prepare no-change report
        if: steps.changed.outputs.has_changes == 'false'
        run: |
          printf '%s\n' \
            '## Plugin TOML Validation Report' \
            '' \
            '**Status**: ✅ No plugin submodules changed' \
            '' \
            'No plugin TOML validation was required for this pull request' > validation-report.md

      - name: Prepare fallback report
        if: always() && steps.changed.outputs.has_changes == 'true'
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          if [ -f validation-report.md ]; then
            exit 0
          fi

          if [ "$VALIDATE_OUTCOME" = "failure" ]; then
            printf '%s\n' \
              '## Plugin TOML Validation Report' \
              '' \
              '**Status**: ❌ Validation stopped before a report could be generated' \
              '' \
              'Review the validation step logs for the error' > validation-report.md
          else
            printf '%s\n' \
              '## Plugin TOML Validation Report' \
              '' \
              '**Status**: ✅ Validation completed' > validation-report.md
          fi

      - name: Upload validation report
        if: always() && steps.changed.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: plugin-toml-validation
          path: validation-report.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail if validation failed
        if: steps.validate.outcome == 'failure'
        run: exit 1
