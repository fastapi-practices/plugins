name: Auto Submit Plugin

on:
  issues:
    types:
      - opened
      - edited

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: plugin-submission-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  submit:
    if: >-
      startsWith(github.event.issue.title, '[Plugin Submission]') &&
      github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout marketplace
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PLUGIN_SUBMISSION_TOKEN || github.token }}
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Parse submission form
        id: parse
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const body = process.env.ISSUE_BODY || ''

            function getField(label) {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
              const match = body.match(new RegExp(`### ${escaped}\\s*\\n+([\\s\\S]*?)(?=\\n+### |$)`))
              return match?.[1]?.trim() || ''
            }

            const repositoryText = getField('插件仓库 URL')
            const pluginTypeText = getField('插件类型')

            let repositoryUrl
            try {
              repositoryUrl = new URL(repositoryText)
            } catch {
              core.setFailed('插件仓库 URL 格式无效')
              return
            }

            if (repositoryUrl.protocol !== 'https:' || repositoryUrl.hostname !== 'github.com') {
              core.setFailed('插件仓库 URL 必须是 https://github.com/<owner>/<repo>')
              return
            }
            if (repositoryUrl.search || repositoryUrl.hash) {
              core.setFailed('插件仓库 URL 不能包含查询参数或锚点')
              return
            }

            const pathParts = repositoryUrl.pathname.replace(/\.git$/, '').split('/').filter(Boolean)
            if (pathParts.length !== 2) {
              core.setFailed('插件仓库 URL 必须指向一个 GitHub 仓库根地址')
              return
            }

            const [owner, repository] = pathParts
            if (!/^[A-Za-z0-9](?:[A-Za-z0-9-]{0,38})$/.test(owner)) {
              core.setFailed('GitHub owner 格式无效')
              return
            }
            if (!/^[A-Za-z0-9._-]+$/.test(repository)) {
              core.setFailed('GitHub 仓库名格式无效')
              return
            }
            if (owner.toLowerCase() === 'fastapi-practices' && repository.toLowerCase() === 'plugins') {
              core.setFailed('不能将插件市场仓库本身作为插件提交')
              return
            }
            if (pluginTypeText !== '后端插件' && pluginTypeText !== '前端插件') {
              core.setFailed('插件类型必须是后端插件或前端插件')
              return
            }

            const pluginType = pluginTypeText === '前端插件' ? 'frontend' : 'backend'
            if (pluginType === 'backend' && !/^[a-z0-9_]+$/.test(repository)) {
              core.setFailed('后端插件仓库名只能包含小写字母、数字和下划线')
              return
            }
            if (pluginType === 'frontend' && !/^[a-z0-9_-]+$/.test(repository)) {
              core.setFailed('前端插件仓库名只能包含小写字母、数字、下划线和连字符')
              return
            }
            if (pluginType === 'frontend' && !repository.endsWith('_ui') && !repository.endsWith('-ui')) {
              core.setFailed('前端插件仓库名必须以 _ui 或 -ui 结尾')
              return
            }
            if (pluginType === 'backend' && (repository.endsWith('_ui') || repository.endsWith('-ui'))) {
              core.setFailed('后端插件仓库名不能使用前端插件后缀')
              return
            }

            core.setOutput('owner', owner)
            core.setOutput('repository', repository)
            core.setOutput('plugin_name', repository)
            core.setOutput('plugin_type', pluginType)
            core.setOutput('repository_url', `https://github.com/${owner}/${repository}.git`)
            core.setOutput('repository_display_url', `https://github.com/${owner}/${repository}`)
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}

      - name: Validate and prepare plugin
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_SUBMISSION_TOKEN }}
          SUBMISSION_TOKEN: ${{ secrets.PLUGIN_SUBMISSION_TOKEN }}
          OWNER: ${{ steps.parse.outputs.owner }}
          REPOSITORY: ${{ steps.parse.outputs.repository }}
          PLUGIN_NAME: ${{ steps.parse.outputs.plugin_name }}
          PLUGIN_TYPE: ${{ steps.parse.outputs.plugin_type }}
          PLUGIN_REPOSITORY_URL: ${{ steps.parse.outputs.repository_url }}
          PLUGIN_REPOSITORY_DISPLAY_URL: ${{ steps.parse.outputs.repository_display_url }}
        run: |
          set -euo pipefail

          if [ -z "${SUBMISSION_TOKEN:-}" ]; then
            echo "::error::缺少 PLUGIN_SUBMISSION_TOKEN。必须使用 PAT 创建 PR，才能触发常规校验工作流"
            exit 1
          fi

          if ! REPOSITORY_METADATA=$(gh api "repos/${OWNER}/${REPOSITORY}" --jq '[.private, .default_branch] | @tsv'); then
            echo "::error::无法读取插件仓库，请确认仓库存在且公开"
            exit 1
          fi

          IFS=$'\t' read -r REPOSITORY_PRIVATE PLUGIN_DEFAULT_BRANCH <<< "$REPOSITORY_METADATA"
          if [ "$REPOSITORY_PRIVATE" != 'false' ]; then
            echo "::error::插件仓库必须为公开仓库"
            exit 1
          fi
          if [ -z "$PLUGIN_DEFAULT_BRANCH" ]; then
            echo "::error::无法确定插件仓库默认分支"
            exit 1
          fi

          if git config --file .gitmodules --get-regexp '^submodule\..*\.path$' 2>/dev/null | awk '{print $2}' | grep -Fxq "plugins/${PLUGIN_NAME}"; then
            echo "::error::插件市场中已存在同名插件目录: plugins/${PLUGIN_NAME}"
            exit 1
          fi
          if [ -e "plugins/${PLUGIN_NAME}" ]; then
            echo "::error::插件目录已存在: plugins/${PLUGIN_NAME}"
            exit 1
          fi

          git submodule add "$PLUGIN_REPOSITORY_URL" "plugins/${PLUGIN_NAME}"

          if [ "$PLUGIN_TYPE" = 'backend' ] && [ ! -f "plugins/${PLUGIN_NAME}/plugin.toml" ] && [ -f "plugins/${PLUGIN_NAME}/${PLUGIN_NAME}/plugin.toml" ]; then
            echo "::error::插件内容被多包了一层目录，plugin.toml 必须位于仓库根目录"
            exit 1
          fi

          pnpm install --frozen-lockfile
          pnpm validate "$PLUGIN_NAME"
          pnpm validate:submission "$PLUGIN_NAME" "$PLUGIN_TYPE"
          git diff --check

          echo "plugin_default_branch=${PLUGIN_DEFAULT_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "repository_display_url=${PLUGIN_REPOSITORY_DISPLAY_URL}" >> "$GITHUB_OUTPUT"

      - name: Create or update submission PR
        id: pull-request
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_SUBMISSION_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          PLUGIN_NAME: ${{ steps.parse.outputs.plugin_name }}
          PLUGIN_TYPE: ${{ steps.parse.outputs.plugin_type }}
          PLUGIN_REPOSITORY_DISPLAY_URL: ${{ steps.prepare.outputs.repository_display_url }}
          MARKETPLACE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          SUBMISSION_BRANCH="plugin-submission/${ISSUE_NUMBER}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$SUBMISSION_BRANCH"
          git add .gitmodules "plugins/${PLUGIN_NAME}"
          git commit -m "Add ${PLUGIN_NAME} plugin (#${ISSUE_NUMBER})"
          git push --force-with-lease --set-upstream origin "HEAD:${SUBMISSION_BRANCH}"

          cat > /tmp/plugin-submission-pr.md <<EOF
          <!-- plugin-submission-pr -->
          ## Automated plugin submission

          - Plugin: \`${PLUGIN_NAME}\`
          - Type: \`${PLUGIN_TYPE}\`
          - Repository: ${PLUGIN_REPOSITORY_DISPLAY_URL}
          - Submitted by: @${ISSUE_AUTHOR}
          - Application issue: #${ISSUE_NUMBER}

          The submission workflow verified the public repository, plugin directory structure, \`plugin.toml\`, and required SQL files without executing plugin code.

          ### Marketplace review

          - [ ] Repository ownership and maintenance responsibility are acceptable
          - [ ] Plugin behavior and dependencies have been reviewed
          - [ ] README configuration and uninstall instructions are complete
          - [ ] Validation and relevant tests have passed

          Closes #${ISSUE_NUMBER}
          EOF

          PR_URL=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --head "$SUBMISSION_BRANCH" \
            --json url \
            --jq '.[0].url // ""')

          if [ -n "$PR_URL" ]; then
            gh pr edit "$PR_URL" \
              --title "Add ${PLUGIN_NAME} plugin" \
              --body-file /tmp/plugin-submission-pr.md
          else
            PR_URL=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$MARKETPLACE_BRANCH" \
              --head "$SUBMISSION_BRANCH" \
              --title "Add ${PLUGIN_NAME} plugin" \
              --body-file /tmp/plugin-submission-pr.md)
          fi

          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
          echo "### Plugin submission PR created" >> "$GITHUB_STEP_SUMMARY"
          echo "[${PLUGIN_NAME}](${PR_URL})" >> "$GITHUB_STEP_SUMMARY"

      - name: Report success
        if: success()
        uses: actions/github-script@v7
        env:
          PR_URL: ${{ steps.pull-request.outputs.pr_url }}
          PLUGIN_NAME: ${{ steps.parse.outputs.plugin_name }}
          PLUGIN_REPOSITORY_DISPLAY_URL: ${{ steps.prepare.outputs.repository_display_url }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- plugin-submission-result -->'
            const body = [
              marker,
              '## 自动申请已通过',
              '',
              `插件 \`${process.env.PLUGIN_NAME}\` 的目录结构和 \`plugin.toml\` 校验已通过，submodule PR 已创建，等待维护者审核。`,
              '',
              `- 插件仓库：${process.env.PLUGIN_REPOSITORY_DISPLAY_URL}`,
              `- Pull Request：${process.env.PR_URL}`,
              '',
              '工作流没有执行插件代码或安装脚本。',
            ].join('\n')

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find(comment => comment.body?.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- plugin-submission-result -->'
            const body = [
              marker,
              '## 自动申请未通过',
              '',
              '工作流未能创建或更新插件市场 PR。请根据工作流日志修正问题后编辑本 Issue 重新触发。',
              '',
              `- 工作流日志：${process.env.RUN_URL}`,
            ].join('\n')

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find(comment => comment.body?.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
