name: 插件发布申请
description: 提交一个公开的 fba 插件仓库，由自动化创建插件市场 PR
title: "[Plugin Submission] "
body:
  - type: markdown
    attributes:
      value: |
        请先确认插件仓库为公开仓库，并已完成 README、`plugin.toml`、SQL 和发布前检查。

        提交后，工作流会读取仓库结构和 `plugin.toml`，但不会执行插件代码或安装脚本。校验通过后会创建一个待审核的 submodule PR。

  - type: input
    id: repository_url
    attributes:
      label: 插件仓库 URL
      description: 必须使用 HTTPS GitHub URL，例如 https://github.com/your-name/your-plugin
      placeholder: https://github.com/your-name/your-plugin
    validations:
      required: true

  - type: dropdown
    id: plugin_type
    attributes:
      label: 插件类型
      options:
        - 后端插件
        - 前端插件
    validations:
      required: true

  - type: input
    id: contact
    attributes:
      label: 联系方式
      description: 可填写 GitHub 用户名、邮箱或其他可联系到维护者的方式
      placeholder: "@your-name"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 插件说明
      description: 简要说明插件用途、主要能力、依赖和已知限制
      placeholder: 这个插件提供什么能力，适合哪些使用场景
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: 发布确认
      options:
        - label: 我确认插件仓库为公开仓库，并同意由我承担该插件的维护责任
          required: true
        - label: 我确认插件不依赖未经说明的私有代码，且未静默修改 fba 主项目核心文件
          required: true
